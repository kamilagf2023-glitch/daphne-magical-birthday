<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daphne's Magical Birthday</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Georgia, serif;
  background:
    linear-gradient(rgba(232,239,207,.35), rgba(218,235,201,.45)),
    #dce8c9;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #53684f;
}

.background {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,255,220,.55), transparent 35%),
    linear-gradient(180deg, #dce5c8 0%, #d5e4c2 55%, #cbdcba 100%);
  z-index: -2;
}

.leaves {
  position: absolute;
  top: 0;
  right: 5%;
  width: 230px;
  height: 260px;
  opacity: .45;
  transform: rotate(8deg);
}

.leaves::before,
.leaves::after {
  content: "";
  position: absolute;
  border-left: 2px solid #71886d;
  width: 130px;
  height: 230px;
  border-radius: 50%;
}

.leaves::before {
  right: 60px;
  top: 5px;
  transform: rotate(35deg);
}

.leaves::after {
  right: 20px;
  top: 25px;
  transform: rotate(55deg);
}

.content {
  width: 100%;
  padding: 25px;
}

.title {
  font-size: clamp(38px, 8vw, 72px);
  font-style: italic;
  font-weight: normal;
  color: #53634e;
  margin-bottom: 70px;
}

.subtitle {
  font-size: 18px;
  letter-spacing: 1px;
  margin-bottom: 28px;
  color: #65735d;
}

.envelope-button {
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.envelope {
  position: relative;
  width: min(330px, 78vw);
  height: min(220px, 52vw);
  margin: auto;
  background: linear-gradient(145deg, #829264, #66794e);
  border-radius: 4px;
  box-shadow:
    0 18px 35px rgba(63,78,51,.28),
    0 4px 10px rgba(63,78,51,.18);
  transition: transform .35s ease, box-shadow .35s ease;
}

.envelope-button:active .envelope {
  transform: scale(.95);
}

.envelope::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    145deg,
    transparent 49%,
    rgba(226,220,151,.35) 50%,
    transparent 51%
  );
}

.flap {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 58%;
  background: #78885b;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  z-index: 2;
}

.seal {
  position: absolute;
  left: 50%;
  top: 54%;
  transform: translate(-50%, -50%);
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle, #d9c46c 0 25%, #b49a45 27% 48%, #7b794c 50%);
  border: 2px solid rgba(239,223,143,.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 4;
  box-shadow: 0 3px 8px rgba(50,60,35,.3);
}

.seal::after {
  content: "✦";
  color: #fff3b0;
  font-size: 24px;
}

.envelope-name {
  position: absolute;
  z-index: 3;
  top: 29%;
  left: 50%;
  transform: translateX(-50%);
  color: #f4e9a8;
  font-size: 24px;
  font-style: italic;
  white-space: nowrap;
}

.envelope-small {
  position: absolute;
  z-index: 3;
  top: 45%;
  left: 50%;
  transform: translateX(-50%);
  color: #eee5ad;
  font-size: 10px;
  letter-spacing: 2px;
  white-space: nowrap;
}

.instruction {
  margin-top: 45px;
  font-size: 17px;
  color: #596a54;
  letter-spacing: .5px;
}

.sparkles {
  margin-top: 20px;
  color: #c4a653;
  letter-spacing: 12px;
  font-size: 18px;
}

.fade {
  animation: fadeOut .8s ease forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: scale(1.04);
  }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="leaves"></div>

<div class="content" id="screen">

  <div class="title">Estás invitado</div>

  <div class="subtitle">
    Una invitación mágica está esperando por ti
  </div>

  <button class="envelope-button" id="openEnvelope">
    <div class="envelope">
      <div class="flap"></div>

      <div class="envelope-name">
        Daphne's
      </div>

      <div class="envelope-small">
        MAGICAL BIRTHDAY
      </div>

      <div class="seal"></div>
    </div>
  </button>

  <div class="instruction">
    Toca el sobre para abrir tu invitación
  </div>

  <div class="sparkles">✦ ✧ ✦</div>

</div>

<audio id="music" preload="auto">
  <source src="Ma_Belle_Evangeline_espanol.mp3" type="audio/mpeg">
</audio>

<script>
const envelope = document.getElementById("openEnvelope");
const music = document.getElementById("music");
const screen = document.getElementById("screen");

envelope.addEventListener("click", function() {

  // La interacción con el sobre permite iniciar la música
  music.play().catch(() => {});

  screen.classList.add("fade");

  setTimeout(() => {
    window.location.href =
      "https://canva.link/invitation-daphne-birthday-01";
  }, 800);

});
</script>

</body>
</html>
